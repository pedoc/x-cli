name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v6.0.0 or v6.0.0-fork.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a version such as v6.0.0 or v6.0.0-fork.1."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [[ "$tagged_commit" != "$commit" ]]; then
              echo "::error::Release tag already points to another commit. Select that tag as the workflow ref or use a new tag."
              exit 1
            fi
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: x
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: x
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: x
          - os: macos-15
            target: aarch64-apple-darwin
            binary: x
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: x.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: x.exe
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      BINARY_PATH: target/${{ matrix.target }}/release/${{ matrix.binary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin x --target ${{ matrix.target }}

      - name: Smoke test release binary
        shell: bash
        run: '"$BINARY_PATH" version'

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "$BINARY_PATH" README.md LICENSE.md man/x.1 dist/package/
          tar -czf "dist/x-$RELEASE_TAG-${{ matrix.target }}.tar.gz" -C dist/package x x.1 README.md LICENSE.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item $env:BINARY_PATH, README.md, LICENSE.md -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath "dist/x-$env:RELEASE_TAG-${{ matrix.target }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
